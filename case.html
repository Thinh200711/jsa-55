<!-- Thứ tự nạp file quan trọng: data trước, rồi tới các file dùng chung,
     cuối cùng mới tới script riêng của trang này (nằm ngay trong file) -->
<script src="data.js"></script>
<script src="store.js"></script>
<script src="cart.js"></script>
<script src="auth.js"></script>
<script src="detail.js"></script>
<script>

// ============================================================
// Trang linh kiện độc lập: Case
// Hiển thị toàn bộ sản phẩm trong PARTS['case'] (từ data.js),
// lọc theo hãng, và cho phép xem chi tiết / thêm vào giỏ hàng.
// ============================================================

const PAGE_CAT = 'case';
let pageBrand = 'all';

function pageBrands(){
  return [...new Set(PARTS[PAGE_CAT].map(p => p.brand))].sort();
}

function renderPageBrandFilter(){
  const brands = pageBrands();
  document.getElementById('pageBrandFilter').innerHTML = ['all', ...brands].map(b =>
    `<button class="brand-chip ${pageBrand === b ? 'active' : ''}" onclick="setPageBrand('${b}')">${b === 'all' ? 'Tất cả hãng' : b}</button>`
  ).join('');
}
function setPageBrand(b){
  pageBrand = b;
  renderPageList();
  renderPageBrandFilter();
}

function renderPageList(){
  const items = PARTS[PAGE_CAT].filter(p => pageBrand === 'all' || p.brand === pageBrand);
  document.getElementById('pageCount').textContent = items.length;
  document.getElementById('pageList').innerHTML = items.map(item => `
    <div class="part-card card">
      <button class="info-btn" onclick="event.stopPropagation(); openDetail('${PAGE_CAT}','${item.id}')" title="Xem chi tiết">i</button>
      <div onclick="openDetail('${PAGE_CAT}','${item.id}')">
        <div class="brand-tag">${item.brand}</div>
        <h4>${item.name}</h4>
        <div class="specs">${specChips(item, PAGE_CAT)}</div>
        <div class="price">${fmt(item.price)}</div>
      </div>
    </div>
  `).join('');
}

renderPageBrandFilter();
renderPageList();

</script>
<script src="chatbot.js"></script>
</body>
