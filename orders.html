<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Đơn hàng của tôi — MARC PC</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<nav>
  <div class="nav-inner">
    <div class="logo">
      <span class="logo-mark">
        <svg viewBox="0 0 28 28" fill="none"><rect x="2" y="2" width="24" height="24" rx="2" stroke="#FF7A33" stroke-width="2"/><path d="M9 2V6M19 2V6M9 22V26M19 22V26M2 9H6M2 19H6M22 9H26M22 19H26" stroke="#4FD8C4" stroke-width="1.5"/><rect x="9" y="9" width="10" height="10" fill="#FF7A33"/></svg>
      </span>
      MARC PC
    </div>
    <div class="nav-links">
      <a href="index.html">Trang chủ</a>
      <a href="builder.html">Xây dựng PC</a>
      <a href="prebuilt.html">PC dựng sẵn</a>
      <a href="catalog.html">Linh kiện</a>
    </div>
    <div class="nav-right">
      <div id="navAuth"></div>
      <button class="cart-btn" onclick="toggleCart(true)">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 002 1.61h9.72a2 2 0 002-1.61L23 6H6"/></svg>
        <span class="cart-count" id="cartCount">0</span>
      </button>
    </div>
  </div>
</nav>

<section style="padding-top:48px;">
  <div class="wrap">
    <div class="section-head">
      <div>
        <h2>Đơn hàng của tôi</h2>
        <p>Theo dõi tình trạng xử lý cho từng đơn hàng bạn đã đặt tại MARC PC.</p>
      </div>
    </div>
    <div id="ordersRoot"></div>
  </div>
</section>

<footer>
  <div class="wrap foot-inner">
    <span>© 2026 MARC PC — Linh kiện máy tính &amp; PC theo yêu cầu.</span>
    <span>Demo giao diện · Dữ liệu minh hoạ · Giá tham khảo VNĐ</span>
  </div>
</footer>

<!-- CART DRAWER -->
<div class="overlay" id="overlay" onclick="closeAllOverlays()"></div>
<div class="drawer" id="drawer">
  <div class="drawer-head">
    <strong>Giỏ hàng</strong>
    <button onclick="toggleCart(false)" style="background:none;border:none;color:var(--muted);font-size:20px;cursor:pointer;">×</button>
  </div>
  <div class="drawer-items" id="drawerItems"></div>
  <div class="drawer-foot">
    <div class="summary-row"><span>Tổng cộng</span><b id="drawerTotal" class="mono">0đ</b></div>
    <button class="btn btn-primary" style="width:100%; margin-top:10px;" onclick="openCheckoutModal()">Tiến hành đặt hàng</button>
  </div>
</div>

<!-- CHECKOUT MODAL (Thông tin đặt hàng) -->
<div class="detail-modal" id="checkoutModal">
  <div class="detail-box card checkout-box" id="checkoutBox"></div>
</div>

<!-- AUTH MODAL -->
<div class="detail-modal" id="authModal">
  <div class="detail-box card auth-box" id="authBox"></div>
</div>

<div class="toast" id="toast"></div>

<script src="data.js"></script>
<script src="store.js"></script>
<script src="cart.js"></script>
<script src="auth.js"></script>
<script>
// ============================================================
// Logic riêng trang orders.html
// ============================================================
function statusClass(status){
  return {
    'Chờ xử lý': 'st-cho',
    'Đã duyệt':  'st-duyet',
    'Đang giao': 'st-giao',
    'Hoàn tất':  'st-hoantat',
    'Đã huỷ':    'st-huy',
  }[status] || '';
}
function formatDate(iso){
  const d = new Date(iso);
  return d.toLocaleString('vi-VN', { day:'2-digit', month:'2-digit', year:'numeric', hour:'2-digit', minute:'2-digit' });
}
function renderOrdersPage(){
  const root = document.getElementById('ordersRoot');
  const currentUser = getCurrentUser();

  if(!currentUser){
    root.innerHTML = `<div class="card" style="padding:40px;text-align:center;">
      <p style="margin-bottom:18px;">Vui lòng đăng nhập để xem đơn hàng của bạn.</p>
      <button class="btn btn-primary" onclick="openAuthModal('login')">Đăng nhập</button>
    </div>`;
    return;
  }

  const orders = getOrdersByUser(currentUser.email);
  if(!orders.length){
    root.innerHTML = `<div class="card"><div class="empty-note">Bạn chưa có đơn hàng nào.<br>Hãy build một cấu hình hoặc chọn PC dựng sẵn nhé.</div></div>`;
    return;
  }

  root.innerHTML = `<div class="order-list">${orders.map(o => `
    <div class="card order-card">
      <div class="order-head">
        <div>
          <div class="order-id">MÃ ĐƠN: ${o.id}</div>
          <div class="order-date">${formatDate(o.createdAt)}</div>
        </div>
        <span class="status-badge ${statusClass(o.status)}">${o.status}</span>
      </div>
      <div class="order-items">
        ${o.items.map(i => `<div class="order-item-row"><span>${i.label}</span><b>${fmt(i.price)}</b></div>`).join('')}
      </div>
      ${(o.customerName || o.phone || o.address || o.paymentMethod) ? `
        <div style="font-size:12.5px;color:var(--muted);line-height:1.8;margin:10px 0;padding:10px 12px;background:var(--bg-soft);border-radius:var(--radius-sm);border:1px solid var(--border);">
          ${o.customerName ? `<div>👤 Người nhận: <b style="color:var(--text);">${o.customerName}</b></div>` : ''}
          ${o.phone ? `<div>📞 SĐT: ${o.phone}</div>` : ''}
          ${o.address ? `<div>📍 Địa chỉ: ${o.address}</div>` : ''}
          ${o.paymentMethod ? `<div>💳 Thanh toán: ${o.paymentMethod}</div>` : ''}
        </div>
      ` : ''}
      ${o.discountAmount ? `
        <div class="order-item-row" style="color:var(--accent);">
          <span>Mã giảm giá ${o.discountCode ? '"'+o.discountCode+'"' : ''}</span><b>-${fmt(o.discountAmount)}</b>
        </div>
      ` : ''}
      <div class="order-foot">
        <span style="font-size:12px;color:var(--muted-2);">${o.items.length} sản phẩm</span>
        <span class="order-total">${fmt(o.total)}</span>
      </div>
    </div>
  `).join('')}</div>`;
}

renderOrdersPage();
// Nếu người dùng đăng nhập/đăng xuất ngay trên trang này thì render lại danh sách
const _origCloseAuthModal = closeAuthModal;
closeAuthModal = function(){ _origCloseAuthModal(); renderOrdersPage(); };
const _origLogout = logout;
logout = function(){ _origLogout(); renderOrdersPage(); };
</script>
<script src="chatbot.js"></script>
</body>
</html>
